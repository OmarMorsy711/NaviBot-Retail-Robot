<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navibot - Locate Product</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* ========== GLOBAL RESET ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: #e0e7f1; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        /* ========== MAIN INTERFACE ========== */
        .interface { 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            background: linear-gradient(135deg, #489DFF 0%, #1e62b3 100%); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            animation: gradientShift 10s ease infinite;
            background-size: 200% 200%;
        }
        
        /* Animated gradient background */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ========== TOP BAR ========== */
        .top-bar {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 20;
        }

        .left-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .right-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* Icon Button Style */
        .icon-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            font-style: normal;
        }

        .icon-btn:hover {
            transform: scale(1.1) rotate(5deg);
            background: rgba(255, 255, 255, 0.25);
            border-color: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        /* Cart Button Special */
        .cart-btn {
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4757;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 2px solid white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Language Dropdown */
        .language-container {
            position: relative;
        }
        
        .language-selector {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 12px 25px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            position: relative;
            font-style: normal;
        }
        
        .language-selector:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .language-dropdown {
            position: absolute;
            top: 60px;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            width: 180px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 30;
        }
        
        .language-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        .language-option {
            padding: 12px 20px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
            font-style: normal;
        }
        
        .language-option:hover {
            background: #489DFF;
            color: white;
        }
        
        .language-option.active {
            background: #f0f7ff;
            color: #489DFF;
            font-weight: 600;
        }
        
        .language-option.active:hover {
            background: #489DFF;
            color: white;
        }
        
        .language-option span {
            font-size: 18px;
        }

        /* ========== MAIN CONTENT ========== */
        .content { 
            position: relative; 
            z-index: 5; 
            text-align: center; 
            width: 90%; 
            max-width: 1000px; 
            animation: fadeInUp 0.8s ease;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .navibot-logo { 
            font-family: 'Poppins', sans-serif; 
            font-size: clamp(32px, 8vw, 56px); 
            color: white; 
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* ========== SEARCH BAR ========== */
        .search-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        
        .search-container {
            position: relative;
            flex: 1;
            background: white;
            border-radius: 60px;
            display: flex;
            align-items: center;
            padding: 8px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            z-index: 100;
        }
        
        .search-container:focus-within {
            transform: scale(1.02);
            border-color: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        .search-input { 
            flex: 1; 
            border: none; 
            outline: none; 
            font-size: 18px; 
            padding: 12px 10px; 
            color: #333;
            background: transparent;
        }
        
        .clear-btn { 
            background: none; 
            border: none; 
            font-size: 20px; 
            color: #999; 
            cursor: pointer; 
            margin-right: 10px; 
            display: none;
            transition: all 0.3s ease;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .clear-btn.visible { 
            display: flex; 
        }
        
        .clear-btn:hover {
            background: #f0f0f0;
            color: #ff4757;
            transform: rotate(90deg);
        }
        
        /* Voice Button - Your Style (Outside Search Container) */
        .voice-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
            font-style: normal;
        }
        
        .voice-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1) rotate(5deg);
            border-color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .voice-btn.listening {
            background: #ff4757;
            border-color: white;
            animation: pulse 1s infinite;
            box-shadow: 0 0 20px #ff4757;
        }
        
        .voice-btn.listening i {
            animation: soundwave 1s infinite;
        }
        
        @keyframes soundwave {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        .search-icon-btn { 
            background: #489DFF; 
            color: white; 
            border: none; 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            cursor: pointer; 
            font-size: 24px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-style: normal;
            flex-shrink: 0;
        }
        
        .search-icon-btn:hover { 
            background: #1e62b3; 
            transform: scale(1.15) rotate(360deg);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }
        
        .search-icon-btn:active {
            transform: scale(0.95);
        }

        /* Autocomplete Suggestions */
        .autocomplete-results {
            position: absolute; 
            top: 110%; 
            left: 0; 
            right: 0; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.2); 
            overflow: hidden; 
            display: none; 
            z-index: 1000 !important;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .suggestion-item { 
            padding: 12px 20px; 
            text-align: left; 
            cursor: pointer; 
            border-bottom: 1px solid #f0f0f0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            font-style: normal;
        }
        
        .suggestion-item:hover { 
            background: #f8f9fa;
            padding-left: 30px;
        }
        
        .suggestion-item:hover::before {
            content: '→';
            position: absolute;
            left: 12px;
            color: #489DFF;
            animation: slideRight 0.3s ease;
        }
        
        @keyframes slideRight {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ========== CATEGORIES SLIDER ========== */
        .categories-container {
            position: relative;
            width: 100%;
            padding: 10px 0;
        }

        .categories-slider {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 5px 30px;
            cursor: grab;
            scrollbar-width: none;
            -ms-overflow-style: none;
            mask-image: linear-gradient(
                to right,
                transparent,
                black 10%,
                black 90%,
                transparent
            );
            -webkit-mask-image: linear-gradient(
                to right,
                transparent,
                black 10%,
                black 90%,
                transparent
            );
        }

        .categories-slider:active {
            cursor: grabbing;
        }

        .categories-slider::-webkit-scrollbar {
            display: none;
        }

        .categories-slider.dragging {
            scroll-behavior: auto;
        }

        .category-chip {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            padding: 12px 30px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            font-style: normal;
        }

        .category-chip:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border-color: white;
        }

        .category-chip:active {
            transform: translateY(0) scale(0.98);
        }

        /* ========== ACTION BUTTONS ========== */
        .action-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 16px 40px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 280px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 2px solid transparent;
            font-style: normal;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-5px) scale(1.02);
            border-color: white;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .action-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .action-btn i {
            font-size: 24px;
            font-style: normal;
        }

        /* ========== CAMERA MODAL STYLES ========== */
        .camera-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.55);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .camera-container {
            width: 95%;
            max-width: 1000px; /* Increased from 600px */
            background: #000;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 4/3;
            border: 4px solid white;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .camera-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 3px solid rgba(72, 157, 255, 0.5);
            background: linear-gradient(rgba(72, 157, 255, 0.1) 0%, transparent 50%, rgba(72, 157, 255, 0.1) 100%);
            pointer-events: none;
        }

        .camera-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: #489DFF;
            box-shadow: 0 0 20px #489DFF;
            animation: scanLine 2s infinite linear;
        }

        @keyframes scanLine {
            0% { top: 0%; opacity: 1; }
            50% { opacity: 0.8; }
            100% { top: 100%; opacity: 1; }
        }

        .shutter-btn {
            margin-top: 30px;
            width: 80px;
            height: 80px;
            background: white;
            border: 4px solid #489DFF;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #489DFF;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
            align-self: center;
        }

        .shutter-btn:hover {
            transform: scale(1.1);
            background: #489DFF;
            color: white;
        }

        .shutter-btn:active {
            transform: scale(0.9);
        }

        .close-modal-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10001;
            font-style: normal;
        }

        .close-modal-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        /* ========== LOADING OVERLAY FOR OCR PROCESSING ========== */
        .ocr-loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10002;
            border-radius: 30px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .ocr-loading.show {
            opacity: 1;
            visibility: visible;
        }

        @keyframes ocr-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .ocr-spinner {
            width: 80px;
            height: 80px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top: 6px solid #489DFF;
            border-radius: 50%;
            animation: ocr-spin 1s linear infinite;
            margin-bottom: 30px;
        }

        .ocr-loading p {
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            text-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        .ocr-loading-sub {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            font-family: 'Inter', sans-serif;
        }

        /* ========== CART SIDEBAR ========== */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 30px rgba(0,0,0,0.3);
            transition: right 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            border-radius: 30px 0 0 30px;
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            padding: 30px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-radius: 30px 0 0 0;
        }

        .cart-header h2 {
            font-family: 'Poppins', sans-serif;
            color: #333;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: normal;
        }

        .close-cart:hover {
            background: #f0f0f0;
            color: #ff4757;
            transform: rotate(90deg);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 15px;
            margin-bottom: 15px;
            position: relative;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .cart-item:hover {
            transform: translateX(-5px);
            background: white;
            border-color: #489DFF;
            box-shadow: 0 10px 20px rgba(72, 157, 255, 0.1);
        }

        .cart-item-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 10px;
            margin-right: 15px;
            transition: transform 0.3s ease;
        }

        .cart-item:hover .cart-item-img {
            transform: scale(1.1);
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .cart-item-price {
            color: #489DFF;
            font-weight: 700;
        }

        .remove-item {
            background: none;
            border: none;
            color: #ff4757;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            transition: all 0.3s ease;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: normal;
        }

        .remove-item:hover {
            background: #ff4757;
            color: white;
            transform: scale(1.1);
        }

        .cart-footer {
            padding: 20px;
            border-top: 2px solid #f0f0f0;
            background: #f8f9fa;
            border-radius: 0 0 0 30px;
        }

        .clear-cart {
            width: 100%;
            padding: 12px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            font-style: normal;
        }

        .clear-cart:hover {
            background: #ff3344;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
        }

        .clear-cart:active {
            transform: translateY(0);
        }

        .start-cart-nav {
            width: 100%;
            padding: 12px;
            background: #489DFF;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            font-style: normal;
        }

        .start-cart-nav:hover:not(:disabled) {
            background: #1e62b3;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(72, 157, 255, 0.3);
        }

        .start-cart-nav:active:not(:disabled) {
            transform: translateY(0);
        }

        .start-cart-nav:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* ========== BATTERY INDICATOR ========== */
        .battery-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 50px;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            animation: slideInLeft 0.8s ease;
        }
        
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .battery-container:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            border-color: white;
        }

        .battery-icon {
            width: 45px;
            height: 22px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 5px;
            position: relative;
            transition: all 0.3s ease;
        }

        .battery-icon::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 5px;
            width: 4px;
            height: 8px;
            background: white;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .battery-container:hover .battery-icon::after {
            background: #4caf50;
        }

        .battery-level {
            height: 100%;
            background: #4caf50;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .battery-text {
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .battery-icon.low .battery-level {
            background: #ff4757;
        }

        .battery-icon.medium .battery-level {
            background: #ffa502;
        }

        /* ========== TOAST NOTIFICATION ========== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: white;
            color: #333;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-weight: 600;
            z-index: 2000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border-left: 4px solid #489DFF;
            font-family: 'Inter', sans-serif;
            font-style: normal;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ========== DECORATIVE ORBS ========== */
        .orb {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 1;
            animation: float 10s infinite alternate ease-in-out;
        }
        
        .orb-1 {
            width: 40vw;
            height: 40vw;
            top: -10%;
            left: -10%;
            animation: floatSlow 15s infinite alternate;

        .orb-2 {
            width: 30vw;
            height: 30vw;
            bottom: -5%;
            right: -5%;
            animation: floatSlow 12s infinite alternate-reverse;
        }
        
        @keyframes floatSlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.1); }
        }

    <script>

        // UI text translations for the page
        const translations = {
            en: {

                searchPlaceholder: "What are you looking for?"
            },
            ar: {
                locateTitle: "البحث عن منتج",

            },

            },
            hi: {

            },
            ur: {

                searchPlaceholder: "آپ کیا ڈھونڈ رہے ہیں؟"
            },
            zh: {
                locateTitle: "查找商品",
                searchPlaceholder: "你在找什么？"
            }
        };

        // Language names for displaying in toasts
        const languageNames = {
            en: 'English',
            ar: 'Arabic',
            fr: 'French',
            hi: 'Hindi',
            ur: 'Urdu',
            zh: 'Chinese'
        };

        // -------------------------------------------------------------------------
        // LANGUAGE DROPDOWN FUNCTIONS
        // -------------------------------------------------------------------------

        // Toggle language dropdown visibility
        function toggleLanguageDropdown() {
            const dropdown = document.getElementById('languageDropdown');
            dropdown.classList.toggle('show');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const container = document.querySelector('.language-container');
            const dropdown = document.getElementById('languageDropdown');
            
            if (!container.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });

        // Change the current language
        function changeLanguage(langCode, langName, event) {
            // Update selected language text
            document.getElementById('selectedLanguage').textContent = langName;
            
            // Update active class in dropdown
            const options = document.querySelectorAll('.language-option');
            options.forEach(option => {
                option.classList.remove('active');
            });
            if (event) {
                event.target.closest('.language-option').classList.add('active');
            }
            
            // Update UI text elements
            if (translations[langCode]) {
                document.getElementById('locateTitle').textContent = translations[langCode].locateTitle;
                document.getElementById('skuInput').placeholder = translations[langCode].searchPlaceholder;
            }
            
            // Update category chips with translations
            updateCategoryChips(langCode);
            
            // Close dropdown
            document.getElementById('languageDropdown').classList.remove('show');
            
            // Save language preference to localStorage
            localStorage.setItem('preferredLanguage', langCode);
        }

        // Update category chips based on selected language
        function updateCategoryChips(langCode) {
            const slider = document.getElementById('categoriesSlider');
            if (!slider) return;
            
            slider.innerHTML = '';
            
            categories.forEach(category => {
                const chip = document.createElement('div');
                chip.className = 'category-chip';
                
                // Get translated category name or fallback to English
                const translatedCategory = categoryTranslations[langCode]?.[category] || category;
                chip.textContent = translatedCategory;
                
                // Store the original English category for search
                chip.setAttribute('data-category', category);
                
                chip.onclick = () => quickSearch(category);
                slider.appendChild(chip);
            });
        }

        // -------------------------------------------------------------------------
        // CATEGORIES SLIDER (AUTO-SLIDING & DRAG)
        // -------------------------------------------------------------------------

        let slideInterval;
        const slideSpeed = 2; // pixels per interval
        const slideDelay = 5; // milliseconds between moves
        
        // Start the auto-sliding animation
        function startSliding() {
            const slider = document.getElementById('categoriesSlider');
            if (!slider) return;
            
            // Clear any existing interval
            if (slideInterval) clearInterval(slideInterval);
            
            slideInterval = setInterval(() => {
                // Only slide if not being dragged/interacted with
                if (!slider.classList.contains('dragging') && !slider.matches(':hover')) {
                    slider.scrollLeft += slideSpeed;
                    
                    // Reset to start when reaching the end
                    if (slider.scrollLeft >= (slider.scrollWidth - slider.clientWidth)) {
                        slider.scrollLeft = 0;
                    }
                }
            }, slideDelay);
        }

        // Initialize drag-to-scroll functionality
        function initDragScroll() {
            const slider = document.getElementById('categoriesSlider');
            if (!slider) return;
            
            let isDown = false;
            let startX;
            let scrollLeft;

            // Mouse events for desktop
            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                slider.classList.add('dragging');
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
                
                // Pause auto-slide while dragging
                if (slideInterval) clearInterval(slideInterval);
            });

            slider.addEventListener('mouseleave', () => {
                isDown = false;
                slider.classList.remove('dragging');
                // Resume auto-slide
                startSliding();
            });

            slider.addEventListener('mouseup', () => {
                isDown = false;
                slider.classList.remove('dragging');
                // Resume auto-slide
                startSliding();
            });

            slider.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 2; // Scroll speed multiplier
                slider.scrollLeft = scrollLeft - walk;
            });

            // Touch events for mobile
            slider.addEventListener('touchstart', (e) => {
                isDown = true;
                slider.classList.add('dragging');
                startX = e.touches[0].pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
                if (slideInterval) clearInterval(slideInterval);
            });

            slider.addEventListener('touchend', () => {
                isDown = false;
                slider.classList.remove('dragging');
                startSliding();
            });

            slider.addEventListener('touchmove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.touches[0].pageX - slider.offsetLeft;
                const walk = (x - startX) * 2;
                slider.scrollLeft = scrollLeft - walk;
            });
        }

        // -------------------------------------------------------------------------
        // BATTERY SIMULATION (localStorage version)
        // -------------------------------------------------------------------------

        let batteryLevel;

        // Initialize or load battery level from localStorage
        function initBattery() {
            const savedBattery = localStorage.getItem('globalBatteryLevel');
            const lastUpdate = localStorage.getItem('batteryLastUpdate');
            
            if (savedBattery && lastUpdate) {
                // Calculate how much battery should have drained since last visit
                const timeDiff = (Date.now() - parseInt(lastUpdate)) / 1000; // in seconds
                const drainAmount = timeDiff * 0.1; // 0.1% per second
                batteryLevel = Math.max(0, parseFloat(savedBattery) - drainAmount);
            } else {
                batteryLevel = 100; // Start at 100% if no saved data
            }
            
            // If battery reached 0, reset to 100
            if (batteryLevel <= 0) {
                batteryLevel = 100;
            }
            
            updateBatteryDisplay();
        }

        function updateBatteryDisplay() {
            // Add safety check
            if (typeof batteryLevel !== 'number' || isNaN(batteryLevel)) {
                batteryLevel = 100;
            }
            const batteryLevelElem = document.getElementById('batteryLevel');
            const batteryText = document.getElementById('batteryText');
            const batteryIcon = document.getElementById('batteryIcon');
            
            if (batteryLevelElem) {
                batteryLevelElem.style.width = Math.floor(batteryLevel) + '%';
            }
            if (batteryText) {
                batteryText.textContent = Math.floor(batteryLevel) + '%';
            }
            
            // Update color based on level
            if (batteryIcon) {
                batteryIcon.classList.remove('low', 'medium');
                if (batteryLevel < 20) {
                    batteryIcon.classList.add('low');
                } else if (batteryLevel < 50) {
                    batteryIcon.classList.add('medium');
                }
            }
        }

        function updateBattery() {
            batteryLevel = Math.max(0, batteryLevel - 0.1);
            
            // Save to localStorage with timestamp
            localStorage.setItem('globalBatteryLevel', batteryLevel.toString());
            localStorage.setItem('batteryLastUpdate', Date.now().toString());
            
            updateBatteryDisplay();
            
            // Check if battery reached 20% or below
            if (batteryLevel <= 20) {
                // Reset to 100% (no redirect)
                batteryLevel = 100;
                localStorage.setItem('globalBatteryLevel', '100');
                localStorage.setItem('batteryLastUpdate', Date.now().toString());
                updateBatteryDisplay();
            }
            
            // Continue the cycle
            setTimeout(updateBattery, 1000);
        }

        // -------------------------------------------------------------------------
        // GROQ VOICE RECOGNITION
        // -------------------------------------------------------------------------

        const voiceBtn = document.getElementById('voiceBtn');
        const searchInput = document.getElementById('skuInput');
        
        // Variables for audio recording
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        // Check if browser supports audio recording
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            voiceBtn.style.opacity = '0.5';
            voiceBtn.title = 'Audio recording not supported in this browser';
        } else {
            // Voice button click handler
            voiceBtn.addEventListener('click', async () => {
                if (isRecording) {
                    // Stop recording
                    if (mediaRecorder && mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                        isRecording = false;
                        voiceBtn.classList.remove('listening');
                        voiceBtn.innerHTML = '🎤'; // Reset icon
                        showToast('Processing with Groq...', 3000);
                    }
                } else {
                    // Start recording
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        mediaRecorder = new MediaRecorder(stream);
                        audioChunks = [];
                        
                        // Collect audio data chunks
                        mediaRecorder.ondataavailable = event => {
                            audioChunks.push(event.data);
                        };
                        
                        // When recording stops, send to server
                        mediaRecorder.onstop = async () => {
                            // Create audio blob
                            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                            const currentLang = localStorage.getItem('preferredLanguage') || 'en';
                            
                            showToast('Processing...', 3000);
                            
                            // Create form data to send to our server
                            const formData = new FormData();
                            formData.append('audio', audioBlob, 'recording.webm');
                            formData.append('language', currentLang);
                            
                            try {
                                // Send to our server endpoint (which will forward to Groq)
                                const response = await fetch('/api/transcribe', {
                                    method: 'POST',
                                    body: formData
                                });
                                
                                const data = await response.json();
                                
                                if (data.text) {
                                    // Success! Put the transcribed text in search bar
                                    searchInput.value = data.text;
                                    showToast('✓ Transcribed!', 1000);
                                    // Automatically search after voice input
                                    setTimeout(() => {
                                        performSearch();
                                    }, 500);
                                } else {
                                    showToast('Transcription failed', 2000);
                                }
                            } catch (error) {
                                console.error('Transcription error:', error);
                                showToast('Failed to connect to server', 2000);
                            } finally {
                                // Stop all audio tracks to release microphone
                                stream.getTracks().forEach(track => track.stop());
                            }
                        };
                        
                        // Start recording
                        mediaRecorder.start();
                        isRecording = true;
                        voiceBtn.classList.add('listening');
                        voiceBtn.innerHTML = '⏺️'; // Recording icon
                        
                        const currentLang = localStorage.getItem('preferredLanguage') || 'en';
                        showToast(`Recording in ${languageNames[currentLang]}...`, 3000);
                        
                    } catch (error) {
                        console.error('Microphone error:', error);
                        showToast('Could not access microphone', 2000);
                    }
                }
            });
        }

        // -------------------------------------------------------------------------
        // CART FUNCTIONALITY
        // -------------------------------------------------------------------------

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        
        // Update the cart UI (count and items list)
        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const cartItems = document.getElementById('cartItems');
            const startCartNav = document.getElementById('startCartNav');
            
            cartCount.textContent = cart.length;
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; color: #999; margin-top: 50px;">Your cart is empty</p>';
                startCartNav.disabled = true;
                startCartNav.textContent = 'Start Navigation (0 items)';
            } else {
                let html = '';
                cart.forEach((item, index) => {
                    html += `
                        <div class="cart-item">
                            <img src="${item.image_url || 'https://via.placeholder.com/60'}" class="cart-item-img">
                            <div class="cart-item-info">
                                <div class="cart-item-name">${item.name}</div>
                                <div class="cart-item-price">AED ${item.price}</div>
                            </div>
                            <button class="remove-item" onclick="removeFromCart(${index})">🗑️</button>
                        </div>
                    `;
                });
                cartItems.innerHTML = html;
                startCartNav.disabled = false;
                startCartNav.textContent = `Start Navigation (${cart.length} items)`;
            }
            
            // Save to localStorage
            localStorage.setItem('cart', JSON.stringify(cart));
        }
        
        // Toggle cart sidebar open/closed
        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
        }
        
        // Add product to cart
        function addToCart(product) {
            if (cart.length >= 5) {
                showToast('Cart is full (max 5 items)', 2000);
                return;
            }
            
            if (cart.some(item => item.sku === product.sku)) {
                showToast('Item already in cart', 2000);
                return;
            }
            
            cart.push(product);
            updateCartUI();
            showToast('Added to cart!', 2000);
        }
        
        // Remove item from cart by index
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
            showToast('Removed from cart', 2000);
        }
        
        // Clear entire cart
        function clearCart() {
            cart = [];
            updateCartUI();
            showToast('Cart emptied', 2000);
        }
        

// Start navigation with all cart items
function startCartNavigation() {
    if (cart.length === 0) return;

    // Show loading state
    showToast('Preparing navigation...', 2000);

    // Store cart data
    localStorage.setItem('navigationCart', JSON.stringify(cart));
    localStorage.setItem('currentCartIndex', '0');
    
    // Store the order we want (original cart order)
    localStorage.setItem('cartOrder', JSON.stringify(cart.map(item => item.name)));
    
    console.log("Starting navigation with order:", cart.map(item => item.name));
    
    // Navigate to cart-navigation page - we'll handle navigation there
    window.location.href = '/cart-navigation';
}

        // -------------------------------------------------------------------------
        // SHOPPING LIST SCANNER (Browser Camera Preview, Python OCR Processing)
        // -------------------------------------------------------------------------
        let listCameraStream = null;
        let listPhotoCanvas = document.createElement('canvas');
        let ocrLoadingOverlay = null;

        async function scanShoppingList() {
            console.log('🔍 scanShoppingList function called');
            
            try {
                // Check if mediaDevices is supported
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    console.error('❌ MediaDevices not supported');
                    showToast('Camera not supported in this browser', 3000);
                    return;
                }

                // Create modal elements for camera preview (browser handles this)
                const modal = document.createElement('div');
                modal.className = 'camera-modal';
                modal.id = 'cameraModal';
                
                modal.innerHTML = `
                    <div class="close-modal-btn" id="closeModalBtn">✕</div>
                    <div class="camera-container">
                        <video id="listCameraVideo" autoplay playsinline></video>
                        <div class="camera-overlay">
                            <div class="camera-line"></div>
                        </div>
                        <!-- OCR Loading Overlay -->
                        <div class="ocr-loading" id="ocrLoadingOverlay">
                            <div class="ocr-spinner"></div>
                            <p>Processing Your List</p>
                            <div class="ocr-loading-sub">Analyzing... This may take a few seconds</div>
                        </div>
                    </div>
                    <button class="shutter-btn" id="captureListBtn">📸</button>
                `;
                
                document.body.appendChild(modal);
                
                const video = document.getElementById('listCameraVideo');
                const closeBtn = document.getElementById('closeModalBtn');
                const captureBtn = document.getElementById('captureListBtn');
                ocrLoadingOverlay = document.getElementById('ocrLoadingOverlay');
                
                // Start browser camera preview
                try {
                    console.log('📷 Requesting camera preview from browser...');
                    listCameraStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: "environment",
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        } 
                    });
                    
                    video.srcObject = listCameraStream;
                    
                    await video.play();
                    console.log('▶️ Browser preview playing');
                    
                } catch (err) {
                    console.error("❌ Browser camera error:", err);
                    
                    let errorMessage = 'Could not access camera. ';
                    if (err.name === 'NotAllowedError') {
                        errorMessage = 'Camera permission denied. Please allow camera access.';
                    } else if (err.name === 'NotFoundError') {
                        errorMessage = 'No camera found on this device.';
                    } else {
                        errorMessage += err.message;
                    }
                    
                    showToast(errorMessage, 3000);
                    modal.remove();
                    return;
                }
                
                // Handle capture
                captureBtn.onclick = async function() {
                    console.log('📸 Capture button clicked');
                    
                    if (!video.videoWidth) {
                        console.warn('⚠️ Camera not ready yet');
                        showToast('Camera not ready yet', 1000);
                        return;
                    }
                    
                    // Show OCR loading overlay
                    if (ocrLoadingOverlay) {
                        ocrLoadingOverlay.classList.add('show');
                    }
                    
                    // Disable capture button while processing
                    captureBtn.disabled = true;
                    captureBtn.style.opacity = '0.5';
                    
                    // Set canvas dimensions
                    listPhotoCanvas.width = video.videoWidth;
                    listPhotoCanvas.height = video.videoHeight;
                    
                    // Draw video frame to canvas
                    const context = listPhotoCanvas.getContext('2d');
                    context.drawImage(video, 0, 0, listPhotoCanvas.width, listPhotoCanvas.height);
                    
                    // Convert to base64
                    const imageData = listPhotoCanvas.toDataURL('image/jpeg');
                    console.log('🖼️ Image captured, length:', imageData.length);
                    
                    // Stop browser camera immediately
                    if (listCameraStream) {
                        listCameraStream.getTracks().forEach(track => {
                            track.stop();
                            console.log('🛑 Browser camera stopped');
                        });
                    }
                    
                    try {
                        console.log('📡 Sending to OCR endpoint...');
                        
                        // Send to Python server for OCR processing
                        const response = await fetch('http://localhost:5001/extract_list', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ image: imageData })
                        });
                        
                        console.log('📡 Response status:', response.status);
                        
                        const result = await response.json();
                        console.log('📡 OCR result:', result);
                        
                        if (result.success && result.items && result.items.length > 0) {
                            console.log('✅ OCR extracted items:', result.items);
                            
                            // Only cancel the camera scan - NO robot movement commands!
                            await fetch('http://localhost:5001/cancel_scan', { method: 'POST' }).catch(() => {});
                            
                            // Store in localStorage
                            localStorage.setItem('shoppingList', JSON.stringify(result.items));
                            localStorage.setItem('scanMode', 'list');
                            
                            // Close modal
                            modal.remove();
                            
                            showToast(`Found ${result.items.length} items!`, 1500);
                            
                            // Redirect immediately (no waiting for robot)
                            window.location.href = '/list-results';
                        }
                        
                        else {
                            console.log('⚠️ No items detected. Result:', result);
                            
                            // Hide loading overlay
                            if (ocrLoadingOverlay) {
                                ocrLoadingOverlay.classList.remove('show');
                            }
                            
                            // Re-enable capture button
                            captureBtn.disabled = false;
                            captureBtn.style.opacity = '1';
                            
                            let errorMsg = 'No items detected. Try again.';
                            if (result.error) {
                                errorMsg = `OCR Error: ${result.error}`;
                            }
                            
                            showToast(errorMsg, 3000);
                            
                            // Restart browser camera for another try
                            try {
                                console.log('🔄 Restarting camera...');
                                listCameraStream = await navigator.mediaDevices.getUserMedia({ 
                                    video: { 
                                        facingMode: "environment",
                                        width: { ideal: 1920 },
                                        height: { ideal: 1080 }
                                    } 
                                });
                                video.srcObject = listCameraStream;
                                await video.play();
                                console.log('✅ Camera restarted');
                            } catch (restartErr) {
                                console.error('❌ Failed to restart camera:', restartErr);
                                modal.remove();
                            }
                        }
                        
                    } catch (error) {
                        console.error('❌ OCR request failed:', error);
                        
                        // Hide loading overlay
                        if (ocrLoadingOverlay) {
                            ocrLoadingOverlay.classList.remove('show');
                        }
                        
                        // Re-enable capture button
                        captureBtn.disabled = false;
                        captureBtn.style.opacity = '1';
                        
                        showToast('Failed to connect to OCR server', 3000);
                        
                        // For fallback, use demo list
                        console.log('📝 Using demo list as fallback');
                        setTimeout(() => {
                            const demoList = ['milk', 'bread', 'eggs', 'cereal', 'juice'];
                            localStorage.setItem('shoppingList', JSON.stringify(demoList));
                            localStorage.setItem('scanMode', 'list');
                            modal.remove();
                            window.location.href = '/list-results';
                        }, 2000);
                    }
                };
                
                // Handle close
                closeBtn.onclick = function() {
                    console.log('❌ Modal closed by user');
                    
                    // Stop browser camera
                    if (listCameraStream) {
                        listCameraStream.getTracks().forEach(track => track.stop());
                    }
                    
                    modal.remove();
                };
                
            } catch (error) {
                console.error('❌ Fatal error in scanShoppingList:', error);
                showToast('Error: ' + error.message, 4000);
            }
        }

        // -------------------------------------------------------------------------
        // TOAST NOTIFICATION
        // -------------------------------------------------------------------------

        function showToast(message, duration = 2000) {
            console.log('🔔 Toast:', message);
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // -------------------------------------------------------------------------
        // SEARCH FUNCTIONALITY
        // -------------------------------------------------------------------------

        const input = document.getElementById('skuInput');
        const clearBtn = document.getElementById('clearBtn');
        const autoBox = document.getElementById('autocompleteBox');

        // Handle input changes (for autocomplete)
        input.addEventListener('input', async () => {
            clearBtn.classList.toggle('visible', input.value.length > 0);
            const query = input.value.trim();
            
            if (query.length > 1) {
                try {
                    const res = await fetch(`/api/search?q=${query}`);
                    const data = await res.json();
                    if (data.results && data.results.length > 0) {
                        autoBox.innerHTML = data.results.slice(0, 5).map(item => 
                            `<div class="suggestion-item" onclick="selectItem('${item.name}', '${item.sku}', '${item.price}', '${item.image_url || ''}')">${item.name}</div>`
                        ).join('');
                        autoBox.style.display = 'block';
                    } else {
                        autoBox.style.display = 'none';
                    }
                } catch (error) {
                    console.error('Search error:', error);
                    autoBox.style.display = 'none';
                }
            } else { 
                autoBox.style.display = 'none'; 
            }
        });

        // Select item from autocomplete
        function selectItem(name, sku, price, image_url) {
            input.value = name;
            autoBox.style.display = 'none';
            
            localStorage.setItem('quickProduct', JSON.stringify({
                name: name,
                sku: sku,
                price: price,
                image_url: image_url
            }));
            
            performSearch();
        }

        // Clear search input
        clearBtn.onclick = () => { 
            input.value = ''; 
            clearBtn.classList.remove('visible'); 
            autoBox.style.display = 'none'; 
        };
        
        // Quick search from category chips
        function quickSearch(term) { 
            input.value = term; 
            performSearch(); 
        }

        // Perform the search and navigate to results page
        function performSearch() {
            if (input.value.trim()) {
                localStorage.setItem('lastQuery', input.value);
                window.location.href = '/results';
            }
        }

        // Search button click handler
        document.getElementById('findBtn').onclick = performSearch;
        
        // Enter key in search input triggers search
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // -------------------------------------------------------------------------
        // PAGE LOAD INITIALIZATION (Merged)
        // -------------------------------------------------------------------------
        window.onload = function() {
            console.log('🚀 Page loaded');
            
            // Initialize and start battery simulation
            initBattery();
            setTimeout(() => {
                if (typeof batteryLevel === 'number' && !isNaN(batteryLevel)) {
                    updateBattery();
                }
            }, 1000);
            
            // Initialize cart UI
            updateCartUI();
            
            // Load saved language preference
            const savedLang = localStorage.getItem('preferredLanguage') || 'en';
            let langName = '';
            
            switch(savedLang) {
                case 'en': langName = 'English'; break;
                case 'ar': langName = 'العربية'; break;
                case 'fr': langName = 'Français'; break;
                case 'hi': langName = 'हिन्दी'; break;
                case 'ur': langName = 'اردو'; break;
                case 'zh': langName = '中文'; break;
            }
            
            // Update UI with saved language
            document.getElementById('selectedLanguage').textContent = langName;
            if (translations[savedLang]) {
                document.getElementById('locateTitle').textContent = translations[savedLang].locateTitle;
                document.getElementById('skuInput').placeholder = translations[savedLang].searchPlaceholder;
            }
            
            // Initialize category chips with saved language
            updateCategoryChips(savedLang);
            
            // Initialize drag scroll and auto-slide for categories
            initDragScroll();
            startSliding();
            
            // Update active class in language dropdown
            const options = document.querySelectorAll('.language-option');
            options.forEach((option, index) => {
                option.classList.remove('active');
                if ((savedLang === 'en' && index === 0) ||
                    (savedLang === 'ar' && index === 1) ||
                    (savedLang === 'fr' && index === 2) ||
                    (savedLang === 'hi' && index === 3) ||
                    (savedLang === 'ur' && index === 4) ||
                    (savedLang === 'zh' && index === 5)) {
                    option.classList.add('active');
                }
            });
            
            console.log('✅ Initialization complete');
        };
    </script>
