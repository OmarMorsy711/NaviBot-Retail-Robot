<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navibot - Navigating</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            min-height: 100vh; 
            background: #e0e7f1; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden;
        }

        .interface { 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            background: linear-gradient(135deg, #489DFF 0%, #1e62b3 100%); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: gradientShift 10s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Language Dropdown */
        .language-container {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 20;
        }
        
        .language-selector {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 12px 25px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .language-selector:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .language-selector i {
            font-size: 22px;
        }
        
        .language-dropdown {
            position: absolute;
            top: 70px;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            width: 200px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 30;
        }
        
        .language-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        .language-option {
            padding: 15px 25px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
        }
        
        .language-option:hover {
            background: #489DFF;
            color: white;
        }
        
        .language-option.active {
            background: #f0f7ff;
            color: #489DFF;
            font-weight: 600;
        }
        
        .language-option.active:hover {
            background: #489DFF;
            color: white;
        }
        
        .language-option span {
            font-size: 20px;
        }

        /* Orb animations */
        .orb {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 1;
            animation: float 10s infinite alternate ease-in-out;
        }
        
        .orb-1 {
            width: 40vw;
            height: 40vw;
            top: -10%;
            left: -10%;
            animation: floatSlow 15s infinite alternate;
        }
        
        .orb-2 {
            width: 30vw;
            height: 30vw;
            bottom: -5%;
            right: -5%;
            animation: floatSlow 12s infinite alternate-reverse;
        }
        
        @keyframes floatSlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.1); }
        }

        .spinner {
            width: 120px;
            height: 120px;
            border: 10px solid rgba(255, 255, 255, 0.1);
            border-top: 10px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 40px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .status-text {
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 42px;
            margin-bottom: 15px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .sub-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 22px;
            max-width: 70%;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        #arrivalIcon {
            font-size: 100px;
            display: none;
            margin-bottom: 30px;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .button-group {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .home-btn, .cancel-btn {
            padding: 18px 50px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 20px;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .home-btn {
            background: white;
            color: #489DFF;
        }

        .cancel-btn {
            background: #ff4757;
            color: white;
        }

        .home-btn:hover, .cancel-btn:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .home-btn:active, .cancel-btn:active {
            transform: scale(0.95);
        }

        /* Battery Icon */
        .battery-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 50px;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            animation: slideInLeft 0.8s ease;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .battery-container:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            border-color: white;
        }

        .battery-icon {
            width: 50px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 5px;
            position: relative;
            transition: all 0.3s ease;
        }

        .battery-icon::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 6px;
            width: 4px;
            height: 8px;
            background: white;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .battery-container:hover .battery-icon::after {
            background: #4caf50;
        }

        .battery-level {
            height: 100%;
            background: #4caf50;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .battery-text {
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .battery-icon.low .battery-level {
            background: #ff4757;
        }

        .battery-icon.medium .battery-level {
            background: #ffa502;
        }
    </style>
</head>
<body>
    <div class="interface">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        
        <!-- Language Dropdown -->
        <div class="language-container">
            <div class="language-selector" onclick="toggleLanguageDropdown()">
                🌐
                <span id="selectedLanguage">English</span>
                ▼
            </div>
            <div class="language-dropdown" id="languageDropdown">
                <div class="language-option active" onclick="changeLanguage('en', 'English', event)">
                    <span>🇬🇧</span> English
                </div>
                <div class="language-option" onclick="changeLanguage('ar', 'العربية', event)">
                    <span>🇸🇦</span> العربية
                </div>
                <div class="language-option" onclick="changeLanguage('fr', 'Français', event)">
                    <span>🇫🇷</span> Français
                </div>
                <div class="language-option" onclick="changeLanguage('hi', 'हिन्दी', event)">
                    <span>🇮🇳</span> हिन्दी
                </div>
                <div class="language-option" onclick="changeLanguage('ur', 'اردو', event)">
                    <span>🇵🇰</span> اردو
                </div>
                <div class="language-option" onclick="changeLanguage('zh', '中文', event)">
                    <span>🇨🇳</span> 中文
                </div>
            </div>
        </div>
        
        <div id="arrivalIcon">📍</div>
        <div id="mainSpinner" class="spinner"></div>
        
        <h1 id="statusText" class="status-text">Connecting to Robot...</h1>
        <p id="subText" class="sub-text">Please wait while the Navibot begins navigation.</p>

        <div class="button-group">
            <button id="homeBtn" class="home-btn" onclick="returnHome()" style="display: none;">RETURN TO HOME</button>
            <button id="cancelBtn" class="cancel-btn" onclick="cancelNavigation()">CANCEL NAVIGATION</button>
        </div>
    </div>

    <!-- Battery Indicator -->
    <div class="battery-container">
        <div class="battery-icon" id="batteryIcon">
            <div class="battery-level" id="batteryLevel" style="width: 100%;"></div>
        </div>
        <span class="battery-text" id="batteryText">100%</span>
    </div>

<script>
    // ========== LANGUAGE TRANSLATIONS ==========
    const translations = {
        en: {
            destinationReached: "Destination Reached!",
            returnToHome: "RETURN TO HOME"
        },
        ar: {
            destinationReached: "تم الوصول إلى الوجهة!",
            returnToHome: "العودة إلى الرئيسية"
        },
        fr: {
            destinationReached: "Destination Atteinte!",
            returnToHome: "RETOUR À L'ACCUEIL"
        },
        hi: {
            destinationReached: "गंतव्य पर पहुंच गए!",
            returnToHome: "होम पेज पर वापस जाएं"
        },
        ur: {
            destinationReached: "منزل مقصود پر پہنچ گئے!",
            returnToHome: "ہوم پیج پر واپس جائیں"
        },
        zh: {
            destinationReached: "到达目的地！",
            returnToHome: "返回主页"
        }
    };

    // Toggle dropdown visibility
    function toggleLanguageDropdown() {
        const dropdown = document.getElementById('languageDropdown');
        dropdown.classList.toggle('show');
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function(event) {
        const container = document.querySelector('.language-container');
        const dropdown = document.getElementById('languageDropdown');
        
        if (!container.contains(event.target)) {
            dropdown.classList.remove('show');
        }
    });

    // Change language
    function changeLanguage(langCode, langName, event) {
        document.getElementById('selectedLanguage').textContent = langName;
        
        const options = document.querySelectorAll('.language-option');
        options.forEach(option => {
            option.classList.remove('active');
        });
        if (event) {
            event.target.closest('.language-option').classList.add('active');
        }
        
        localStorage.setItem('preferredLanguage', langCode);
        updateUITranslations(langCode);
        
        document.getElementById('languageDropdown').classList.remove('show');
    }

    function updateUITranslations(langCode) {
        const statusText = document.getElementById('statusText').textContent;
        const homeBtn = document.getElementById('homeBtn');
        
        if (statusText === "Destination Reached!" || statusText === translations.en.destinationReached || 
            statusText === translations.ar.destinationReached || statusText === translations.fr.destinationReached ||
            statusText === translations.hi.destinationReached || statusText === translations.ur.destinationReached ||
            statusText === translations.zh.destinationReached) {
            document.getElementById('statusText').textContent = translations[langCode].destinationReached;
        }
        
        if (homeBtn.style.display !== 'none') {
            homeBtn.textContent = translations[langCode].returnToHome;
        }
    }

    // ========== BATTERY SIMULATION ==========
    let batteryLevel;

    function initBattery() {
        const savedBattery = localStorage.getItem('globalBatteryLevel');
        const lastUpdate = localStorage.getItem('batteryLastUpdate');
        
        if (savedBattery && lastUpdate) {
            const timeDiff = (Date.now() - parseInt(lastUpdate)) / 1000;
            const drainAmount = timeDiff * 0.1;
            batteryLevel = Math.max(0, parseFloat(savedBattery) - drainAmount);
        } else {
            batteryLevel = 100;
        }
        
        if (batteryLevel <= 0) batteryLevel = 100;
        updateBatteryDisplay();
    }

    function updateBatteryDisplay() {
        if (typeof batteryLevel !== 'number' || isNaN(batteryLevel)) batteryLevel = 100;
        
        const batteryLevelElem = document.getElementById('batteryLevel');
        const batteryText = document.getElementById('batteryText');
        const batteryIcon = document.getElementById('batteryIcon');
        
        if (batteryLevelElem) batteryLevelElem.style.width = Math.floor(batteryLevel) + '%';
        if (batteryText) batteryText.textContent = Math.floor(batteryLevel) + '%';
        
        if (batteryIcon) {
            batteryIcon.classList.remove('low', 'medium');
            if (batteryLevel < 20) batteryIcon.classList.add('low');
            else if (batteryLevel < 50) batteryIcon.classList.add('medium');
        }
    }

    function updateBattery() {
        batteryLevel = Math.max(0, batteryLevel - 0.1);
        localStorage.setItem('globalBatteryLevel', batteryLevel.toString());
        localStorage.setItem('batteryLastUpdate', Date.now().toString());
        updateBatteryDisplay();
        
        if (batteryLevel <= 20) {
            batteryLevel = 100;
            localStorage.setItem('globalBatteryLevel', '100');
            localStorage.setItem('batteryLastUpdate', Date.now().toString());
            updateBatteryDisplay();
        }
        
        setTimeout(updateBattery, 1000);
    }

    // ========== NAVIGATION CODE ==========
    let pollInterval;
    const productName = localStorage.getItem('lastQuery') || "your product";
    let navigationActive = true;
    let cancelInProgress = false;
    let userCancelRequested = false;
    
    // IMPORTANT: Add a flag to prevent multiple navigation requests
    let navigationRequestInProgress = false;

    window.onload = function() {
        // Initialize battery
        initBattery();
        setTimeout(() => {
            if (typeof batteryLevel === 'number' && !isNaN(batteryLevel)) {
                updateBattery();
            }
        }, 1000);

        const cancelFlag = sessionStorage.getItem('navCancelledByUser');
        if (cancelFlag === '1') {
            sessionStorage.removeItem('navCancelledByUser');
            window.location.href = '/index';
            return;
        }

        document.getElementById('statusText').textContent = `Navigating to ${productName}...`;
        
        // Start the navigation request
        startNavigation();
        
        // Load saved language preference
        const savedLang = localStorage.getItem('preferredLanguage') || 'en';
        let langName = {
            'en': 'English', 'ar': 'العربية', 'fr': 'Français',
            'hi': 'हिन्दी', 'ur': 'اردو', 'zh': '中文'
        }[savedLang] || 'English';
        
        document.getElementById('selectedLanguage').textContent = langName;
        
        const options = document.querySelectorAll('.language-option');
        options.forEach((option, index) => {
            option.classList.remove('active');
            if ((savedLang === 'en' && index === 0) ||
                (savedLang === 'ar' && index === 1) ||
                (savedLang === 'fr' && index === 2) ||
                (savedLang === 'hi' && index === 3) ||
                (savedLang === 'ur' && index === 4) ||
                (savedLang === 'zh' && index === 5)) {
                option.classList.add('active');
            }
        });
    };

    async function startNavigation() {
        // Prevent multiple navigation requests
        if (navigationRequestInProgress) {
            console.log("Navigation request already in progress, ignoring duplicate");
            return;
        }
        
        navigationRequestInProgress = true;
        
        try {
            const response = await fetch("/api/navigate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    product_name: productName, 
                    source: "user_ui" 
                })
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                const detail = errorData.detail || errorData.error || "Failed to start navigation";
                
                // Handle 409 Conflict (another navigation in progress)
                if (response.status === 409) {
                    console.log("Navigation conflict, checking status...");
                    pollInterval = setInterval(checkRobotStatus, 2000);
                    return;
                }
                
                throw new Error(detail);
            }

            // Navigation started successfully - start polling
            pollInterval = setInterval(checkRobotStatus, 2000);
            
        } catch (error) {
            console.error("Navigation error:", error);
            handleFailure(error.message);
        } finally {
            // Reset the flag after a short delay to prevent immediate duplicates
            setTimeout(() => {
                navigationRequestInProgress = false;
            }, 1000);
        }
    }

    async function checkRobotStatus() {
        if (!navigationActive) return;
        
        try {
            const response = await fetch('/api/navigation/status');
            const data = await response.json();

            if (userCancelRequested) return;

            if (data.ok) {
                if (!data.navigation) {
                    return;
                }

                if (data.state === 'success') {
                    handleArrival();
                } else if (data.state === 'cancelled_by_user') {
                    navigationActive = false;
                    clearInterval(pollInterval);
                    sessionStorage.removeItem('navCancelledByUser');
                    window.location.href = '/index';
                } else if (data.state === 'overridden') {
                    if (userCancelRequested || sessionStorage.getItem('navCancelledByUser') === '1') {
                        navigationActive = false;
                        clearInterval(pollInterval);
                        sessionStorage.removeItem('navCancelledByUser');
                        window.location.href = '/index';
                        return;
                    }
                    handleOverridden(data.navigation.error_message || "Robot is currently out of service.");
                } else if (data.state === 'failed') {
                    handleFailure(data.navigation.error_message);
                } else if (data.state === 'in_progress' || data.state === 'received') {
                    // Still navigating - do nothing
                }
            }
        } catch (error) {
            console.error("Status check error:", error);
        }
    }

    function handleArrival() {
        clearInterval(pollInterval);
        document.getElementById('mainSpinner').style.display = 'none';
        document.getElementById('arrivalIcon').style.display = 'block';
        
        const currentLang = localStorage.getItem('preferredLanguage') || 'en';
        document.getElementById('statusText').textContent = translations[currentLang].destinationReached;
        document.getElementById('subText').textContent = `The ${productName} is ready for collection.`;
        
        const homeBtn = document.getElementById('homeBtn');
        homeBtn.style.display = 'inline-block';
        homeBtn.textContent = translations[currentLang].returnToHome;
        document.getElementById('cancelBtn').style.display = 'none';
    }

    function handleFailure(error) {
        clearInterval(pollInterval);
        document.getElementById('statusText').textContent = "Navigation Interrupted";
        document.getElementById('subText').textContent = error || "The robot encountered an issue.";

        const homeBtn = document.getElementById('homeBtn');
        homeBtn.style.display = 'inline-block';
        homeBtn.textContent = translations[localStorage.getItem('preferredLanguage') || 'en'].returnToHome;
        document.getElementById('cancelBtn').style.display = 'none';
    }

    function handleOverridden(errorMessage) {
        if (userCancelRequested || sessionStorage.getItem('navCancelledByUser') === '1') {
            navigationActive = false;
            clearInterval(pollInterval);
            sessionStorage.removeItem('navCancelledByUser');
            window.location.href = '/index';
            return;
        }

        clearInterval(pollInterval);
        navigationActive = false;
        const reason = encodeURIComponent(errorMessage || "Robot is currently out of service.");
        window.location.href = `/out_of_service?reason=${reason}`;
    }

    async function cancelNavigation() {
        if (cancelInProgress) return;

        cancelInProgress = true;
        userCancelRequested = true;
        sessionStorage.setItem('navCancelledByUser', '1');
        navigationActive = false;
        clearInterval(pollInterval);
        
        const cancelBtn = document.getElementById('cancelBtn');
        cancelBtn.disabled = true;
        cancelBtn.textContent = 'CANCELLING...';

        try {
            // First try the user cancel endpoint (gentle cancel)
            const response = await fetch("/api/user/override/cancel_navigation", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ source: "user_ui" })
            });

            if (!response.ok) {
                // If gentle cancel fails, force stop
                await fetch("/api/admin/override/stop", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ source: "user_ui" })
                });
            }

            // CRITICAL: Also call reset_navigation to clear any stuck locks
            await fetch("/api/reset_navigation", {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            }).catch(() => {});

            // Wait a moment for everything to settle
            await new Promise(resolve => setTimeout(resolve, 500));
            
            // Redirect to home
            window.location.href = "/index";
            
        } catch (error) {
            console.error("Cancel error:", error);
            // Even if everything fails, try to reset and redirect
            try {
                await fetch("/api/reset_navigation", { method: "POST" });
            } catch {}
            setTimeout(() => {
                window.location.href = "/index";
            }, 1000);
        } finally {
            cancelInProgress = false;
        }
    }

    function returnHome() {
        window.location.href = "/index";
    }
</script>
</body>
</html>
