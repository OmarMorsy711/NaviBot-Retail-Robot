<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navibot - Out of Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            min-height: 100vh; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden;
        }

        .interface { 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            background: linear-gradient(135deg, #B22234 0%, #8B1A1A 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.5s ease;
        }

        /* Orb animations */
        .orb {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 1;
            animation: float 10s infinite alternate ease-in-out;
        }
        
        .orb-1 {
            width: 40vw;
            height: 40vw;
            top: -10%;
            left: -10%;
            animation: floatSlow 15s infinite alternate;
        }
        
        .orb-2 {
            width: 30vw;
            height: 30vw;
            bottom: -5%;
            right: -5%;
            animation: floatSlow 12s infinite alternate-reverse;
        }
        
        @keyframes floatSlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.1); }
        }

        /* Main Status Container */
        .status-container {
            text-align: center;
            z-index: 5;
            padding: 20px;
            max-width: 800px;
            width: 90%;
        }

        /* Icon Container */
        .icon-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 4s ease-in-out infinite;
        }

        .x-circle {
            width: 180px;
            height: 180px;
            background: rgba(139, 0, 0, 0.4);
            border: 4px solid #FFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .x-line {
            position: absolute;
            width: 100px;
            height: 12px;
            background: white;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .x-line:first-child {
            transform: rotate(45deg);
        }

        .x-line:last-child {
            transform: rotate(-45deg);
        }

        /* Status Text */
        .status-text {
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
            animation: fadeInUp 0.8s ease;
        }

        .reason {
            color: rgba(255, 255, 255, 0.9);
            font-size: 20px;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
            animation: fadeInUp 1s ease;
        }

        /* Loading Dots Animation */
        .loading-dots {
            display: inline-flex;
            gap: 8px;
            margin-top: 30px;
        }
        
        .loading-dots span {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: dotPulse 1.4s infinite ease-in-out both;
        }
        
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes dotPulse {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="interface">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

        <!-- Main Status Container -->
        <div class="status-container">
            <div class="icon-container">
                <div class="x-circle">
                    <div class="x-line"></div>
                    <div class="x-line"></div>
                </div>
            </div>
            <h1 class="status-text">Out of Service</h1>
            <p class="reason" id="reasonText">Please wait while the robot returns to base...</p>
            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>

    <script>
        let pollInterval;
        let screenStateSyncInFlight = false;

        // Get reason from URL if provided
        const params = new URLSearchParams(window.location.search);
        const reason = params.get('reason');
        if (reason) {
            document.getElementById('reasonText').textContent = decodeURIComponent(reason);
        }

        async function syncCustomerScreenState() {
            if (screenStateSyncInFlight) return;
            screenStateSyncInFlight = true;
            try {
                const response = await fetch('/api/customer/screen-state');
                const data = await response.json();

                if (!data.ok) return;

                // Check if we should exit out of service mode
                // If mode is charging (at base) or normal, go back to index
                if (data.mode === 'charging' || data.mode === 'normal') {
                    window.location.href = '/index';
                    return;
                }

                // If mode is black (powered off), go to shutdown
                if (data.mode === 'black') {
                    window.location.href = '/shutdown';
                    return;
                }

                // If mode is low_battery, go to low battery page
                if (data.mode === 'low_battery') {
                    window.location.href = '/low_battery';
                    return;
                }

                // Stay on out_of_service for other modes (out_of_service, heading_to_base)

            } catch (error) {
                console.error('Screen state sync error:', error);
            } finally {
                screenStateSyncInFlight = false;
            }
        }

        // Start polling every 2 seconds
        pollInterval = setInterval(syncCustomerScreenState, 2000);
        
        // Do an initial check immediately
        syncCustomerScreenState();

        // Clean up on page unload
        window.addEventListener('beforeunload', function() {
            if (pollInterval) clearInterval(pollInterval);
        });
    </script>
</body>
</html>
