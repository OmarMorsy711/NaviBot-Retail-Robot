<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navibot - Product Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body { 
            background: #e0e7f1; 
            font-family: 'Inter', sans-serif; 
        }

        .interface { 
            width: 100%; 
            height: 100%; 
            position: relative; 
            background: linear-gradient(135deg, #489DFF 0%, #1e62b3 100%); 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: gradientShift 10s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .back-button { 
            position: absolute; top: 30px; left: 30px; 
            width: 44px; height: 44px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            color: white; text-decoration: none; 
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; line-height: 1; z-index: 10;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .back-button:hover {
            transform: scale(1.1) rotate(-5deg);
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Language Dropdown */
        .language-container {
            position: absolute;
            top: 30px;
            right: 90px; /* Positioned left of cart button */
            z-index: 20;
        }
        
        .language-selector {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 10px 20px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .language-selector:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .language-selector i {
            font-size: 20px;
        }
        
        .language-dropdown {
            position: absolute;
            top: 60px;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            width: 180px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 30;
        }
        
        .language-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        .language-option {
            padding: 12px 20px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Inter', sans-serif;
        }
        
        .language-option:hover {
            background: #489DFF;
            color: white;
        }
        
        .language-option.active {
            background: #f0f7ff;
            color: #489DFF;
            font-weight: 600;
        }
        
        .language-option.active:hover {
            background: #489DFF;
            color: white;
        }
        
        .language-option span {
            font-size: 18px;
        }

        /* Cart Button */
        .cart-button { 
            position: absolute; 
            top: 30px; 
            right: 30px; 
            width: 50px; 
            height: 50px; 
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(10px); 
            border-radius: 50%; 
            color: white; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 24px; 
            line-height: 1; 
            z-index: 10;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .cart-button:hover {
            transform: scale(1.15) rotate(5deg);
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }
        
        .cart-button:active {
            transform: scale(0.95);
        }
        
        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4757;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 2px solid white;
            animation: pulse 2s infinite;
        }

        /* Cart Sidebar */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 30px rgba(0,0,0,0.3);
            transition: right 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            border-radius: 30px 0 0 30px;
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            padding: 30px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-radius: 30px 0 0 0;
        }

        .cart-header h2 {
            font-family: 'Poppins', sans-serif;
            color: #333;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-cart:hover {
            background: #f0f0f0;
            color: #ff4757;
            transform: rotate(90deg);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 15px;
            margin-bottom: 15px;
            position: relative;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .cart-item:hover {
            transform: translateX(-5px);
            background: white;
            border-color: #489DFF;
            box-shadow: 0 10px 20px rgba(72, 157, 255, 0.1);
        }

        .cart-item-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 10px;
            margin-right: 15px;
            transition: transform 0.3s ease;
        }

        .cart-item:hover .cart-item-img {
            transform: scale(1.1);
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .cart-item-price {
            color: #489DFF;
            font-weight: 700;
        }

        .remove-item {
            background: none;
            border: none;
            color: #ff4757;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            transition: all 0.3s ease;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-item:hover {
            background: #ff4757;
            color: white;
            transform: scale(1.1);
        }

        .cart-footer {
            padding: 20px;
            border-top: 2px solid #f0f0f0;
            background: #f8f9fa;
            border-radius: 0 0 0 30px;
        }

        .clear-cart {
            width: 100%;
            padding: 12px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .clear-cart:hover {
            background: #ff3344;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
        }

        .clear-cart:active {
            transform: translateY(0);
        }

        .start-cart-nav {
            width: 100%;
            padding: 12px;
            background: #489DFF;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .start-cart-nav:hover:not(:disabled) {
            background: #1e62b3;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(72, 157, 255, 0.3);
        }

        .start-cart-nav:active:not(:disabled) {
            transform: translateY(0);
        }

        .start-cart-nav:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .detail-card {
            background: white;
            width: 90%;
            max-width: 900px;
            border-radius: 40px;
            padding: 40px;
            display: flex;
            gap: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .image-section {
            flex: 1;
            background: #f8f9fa;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: transform 0.3s ease;
        }

        .image-section:hover {
            transform: scale(1.02);
        }

        .image-section img {
            max-width: 100%;
            height: auto;
            transition: transform 0.3s ease;
        }

        .image-section:hover img {
            transform: scale(1.05);
        }

        .info-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .item-name {
            font-family: 'Poppins', sans-serif;
            font-size: 36px;
            font-weight: 800;
            color: #333;
            margin-bottom: 10px;
        }

        .item-price {
            font-size: 32px;
            font-weight: 700;
            color: #489DFF;
            margin-bottom: 20px;
        }

        /* Inventory Status */
        .inventory-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 10px;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }

        .inventory-status:hover {
            background: #f0f0f0;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .status-indicator.in-stock {
            background: #4caf50;
            box-shadow: 0 0 10px #4caf50;
            animation: pulse 2s infinite;
        }

        .status-indicator.out-of-stock {
            background: #ff4757;
            box-shadow: 0 0 10px #ff4757;
        }

        .status-text {
            font-weight: 600;
        }

        .in-stock-text {
            color: #4caf50;
        }

        .out-of-stock-text {
            color: #ff4757;
        }

        .location-container {
            display: flex;
            gap: 15px;
            margin-bottom: 35px;
        }

        .location-badge {
            flex: 1;
            background: #f0f7ff;
            border: 2px solid #ddecff;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .location-badge:hover {
            transform: translateY(-3px);
            border-color: #489DFF;
            box-shadow: 0 10px 20px rgba(72, 157, 255, 0.1);
        }

        .loc-label {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7ba6d9;
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .location-badge:hover .loc-label {
            color: #489DFF;
        }

        .loc-value {
            font-family: 'Poppins', sans-serif;
            font-size: 34px;
            font-weight: 800;
            color: #1e62b3;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .nav-btn {
            flex: 1;
            background: #489DFF;
            color: white;
            border: none;
            padding: 22px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(72, 157, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .nav-btn:hover:not(:disabled) { 
            background: #1e62b3; 
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(30, 98, 179, 0.4);
        }

        .nav-btn:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }

        .nav-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.5;
        }

        .cart-btn {
            flex: 1;
            background: #4caf50;
            color: white;
            border: none;
            padding: 22px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
            position: relative;
            overflow: hidden;
        }

        .cart-btn:hover:not(:disabled) { 
            background: #388e3c; 
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(56, 142, 60, 0.4);
        }

        .cart-btn:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }

        .cart-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.5;
        }

        #loading { color: white; font-size: 24px; }

        /* Battery Icon */
        .battery-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 50px;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            animation: slideInLeft 0.8s ease;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .battery-container:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            border-color: white;
        }

        .battery-icon {
            width: 45px;
            height: 22px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 5px;
            position: relative;
            transition: all 0.3s ease;
        }

        .battery-icon::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 5px;
            width: 4px;
            height: 8px;
            background: white;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .battery-container:hover .battery-icon::after {
            background: #4caf50;
        }

        .battery-level {
            height: 100%;
            background: #4caf50;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .battery-text {
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .battery-icon.low .battery-level {
            background: #ff4757;
        }

        .battery-icon.medium .battery-level {
            background: #ffa502;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: white;
            color: #333;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-weight: 600;
            z-index: 2000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border-left: 4px solid #489DFF;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Orb animations */
        .orb {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 1;
            animation: float 10s infinite alternate ease-in-out;
        }
        
        .orb-1 {
            width: 40vw;
            height: 40vw;
            top: -10%;
            left: -10%;
            animation: floatSlow 15s infinite alternate;
        }
        
        .orb-2 {
            width: 30vw;
            height: 30vw;
            bottom: -5%;
            right: -5%;
            animation: floatSlow 12s infinite alternate-reverse;
        }
        
        @keyframes floatSlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="interface">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        
        <a href="/results" class="back-button">←</a>
        
        <!-- Language Dropdown -->
        <div class="language-container">
            <div class="language-selector" onclick="toggleLanguageDropdown()">
                🌐
                <span id="selectedLanguage">English</span>
                ▼
            </div>
            <div class="language-dropdown" id="languageDropdown">
                <div class="language-option active" onclick="changeLanguage('en', 'English', event)">
                    <span>🇬🇧</span> English
                </div>
                <div class="language-option" onclick="changeLanguage('ar', 'العربية', event)">
                    <span>🇸🇦</span> العربية
                </div>
                <div class="language-option" onclick="changeLanguage('fr', 'Français', event)">
                    <span>🇫🇷</span> Français
                </div>
                <div class="language-option" onclick="changeLanguage('hi', 'हिन्दी', event)">
                    <span>🇮🇳</span> हिन्दी
                </div>
                <div class="language-option" onclick="changeLanguage('ur', 'اردو', event)">
                    <span>🇵🇰</span> اردو
                </div>
                <div class="language-option" onclick="changeLanguage('zh', '中文', event)">
                    <span>🇨🇳</span> 中文
                </div>
            </div>
        </div>
        
        <!-- Cart Sidebar -->
        <div id="cartSidebar" class="cart-sidebar">
            <div class="cart-header">
                <h2>Your Cart (max 5)</h2>
                <button class="close-cart" onclick="toggleCart()">✕</button>
            </div>
            <div id="cartItems" class="cart-items">
                <!-- Cart items will be dynamically added here -->
            </div>
            <div class="cart-footer">
                <button class="clear-cart" onclick="clearCart()">Empty Cart</button>
                <button id="startCartNav" class="start-cart-nav" onclick="startCartNavigation()" disabled>Start Navigation (0 items)</button>
            </div>
        </div>
        
        <!-- Cart Button - opens sidebar -->
        <button class="cart-button" onclick="toggleCart()">
            🛒
            <span id="cartCount" class="cart-count">0</span>
        </button>

        <div id="loading">Loading details...</div>

        <div id="detailCard" class="detail-card" style="display: none;">
            <div class="image-section">
                <img id="prodImg" src="" alt="Product Image">
            </div>
            <div class="info-section">
                <h1 id="prodName" class="item-name">Product Name</h1>
                <div id="prodPrice" class="item-price">AED 0.00</div>
                
                <!-- Inventory Status -->
                <div id="inventoryStatus" class="inventory-status">
                    <div id="statusIndicator" class="status-indicator in-stock"></div>
                    <span id="statusText" class="status-text in-stock-text">In Stock</span>
                </div>
                
                <div class="location-container">
                    <div class="location-badge">
                        <div class="loc-label" id="aisleLabel">Aisle</div>
                        <div id="prodAisle" class="loc-value">--</div>
                    </div>
                    <div class="location-badge">
                        <div class="loc-label" id="shelfLabel">Shelf</div>
                        <div id="prodShelf" class="loc-value">--</div>
                    </div>
                </div>

                <div class="button-group">
                    <button id="navBtn" class="nav-btn" onclick="startNavigation()">START NAVIGATION</button>
                    <button id="cartBtn" class="cart-btn" onclick="addToCart()">ADD TO CART</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Battery Indicator -->
    <div class="battery-container">
        <div class="battery-icon" id="batteryIcon">
            <div class="battery-level" id="batteryLevel" style="width: 100%;"></div>
        </div>
        <span class="battery-text" id="batteryText">100%</span>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script>
        // ========== LANGUAGE TRANSLATIONS ==========
        const translations = {
            en: {
                aisle: "Aisle",
                shelf: "Shelf",
                startNav: "START NAVIGATION",
                addToCart: "ADD TO CART"
            },
            ar: {
                aisle: "الممر",
                shelf: "الرف",
                startNav: "بدء الملاحة",
                addToCart: "أضف إلى السلة"
            },
            fr: {
                aisle: "Allée",
                shelf: "Étagère",
                startNav: "COMMENCER LA NAVIGATION",
                addToCart: "AJOUTER AU PANIER"
            },
            hi: {
                aisle: "गलियारा",
                shelf: "शेल्फ",
                startNav: "नेविगेशन शुरू करें",
                addToCart: "कार्ट में जोड़ें"
            },
            ur: {
                aisle: "گلیارہ",
                shelf: "شیلف",
                startNav: "نیویگیشن شروع کریں",
                addToCart: "کارٹ میں شامل کریں"
            },
            zh: {
                aisle: "过道",
                shelf: "货架",
                startNav: "开始导航",
                addToCart: "加入购物车"
            }
        };

        // Toggle dropdown visibility
        function toggleLanguageDropdown() {
            const dropdown = document.getElementById('languageDropdown');
            dropdown.classList.toggle('show');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const container = document.querySelector('.language-container');
            const dropdown = document.getElementById('languageDropdown');
            
            if (!container.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });

        // Change language (FIXED: added event parameter)
        function changeLanguage(langCode, langName, event) {
            // Update selected language text
            document.getElementById('selectedLanguage').textContent = langName;
            
            // Update active class in dropdown
            const options = document.querySelectorAll('.language-option');
            options.forEach(option => {
                option.classList.remove('active');
            });
            if (event) {
                event.target.closest('.language-option').classList.add('active');
            }
            
            // Update only the specified text elements
            if (translations[langCode]) {
                document.getElementById('aisleLabel').textContent = translations[langCode].aisle;
                document.getElementById('shelfLabel').textContent = translations[langCode].shelf;
                document.getElementById('navBtn').textContent = translations[langCode].startNav;
                document.getElementById('cartBtn').textContent = translations[langCode].addToCart;
            }
            
            // Close dropdown
            document.getElementById('languageDropdown').classList.remove('show');
            
            // Save language preference to localStorage
            localStorage.setItem('preferredLanguage', langCode);
        }

        // ========== BATTERY SIMULATION (UPDATED: no redirects) ==========
        let batteryLevel;

        // Initialize or load battery level from localStorage
        function initBattery() {
            const savedBattery = localStorage.getItem('globalBatteryLevel');
            const lastUpdate = localStorage.getItem('batteryLastUpdate');
            
            if (savedBattery && lastUpdate) {
                // Calculate how much battery should have drained since last visit
                const timeDiff = (Date.now() - parseInt(lastUpdate)) / 1000; // in seconds
                const drainAmount = timeDiff * 0.1; // 0.1% per second
                batteryLevel = Math.max(0, parseFloat(savedBattery) - drainAmount);
            } else {
                batteryLevel = 100; // Start at 100% if no saved data
            }
            
            // If battery reached 0, reset to 100
            if (batteryLevel <= 0) {
                batteryLevel = 100;
            }
            
            updateBatteryDisplay();
        }

        function updateBatteryDisplay() {
            // Safety check
            if (typeof batteryLevel !== 'number' || isNaN(batteryLevel)) {
                batteryLevel = 100;
            }
            
            const batteryLevelElem = document.getElementById('batteryLevel');
            const batteryText = document.getElementById('batteryText');
            const batteryIcon = document.getElementById('batteryIcon');
            
            if (batteryLevelElem) {
                batteryLevelElem.style.width = Math.floor(batteryLevel) + '%';
            }
            if (batteryText) {
                batteryText.textContent = Math.floor(batteryLevel) + '%';
            }
            
            // Update color based on level
            if (batteryIcon) {
                batteryIcon.classList.remove('low', 'medium');
                if (batteryLevel < 20) {
                    batteryIcon.classList.add('low');
                } else if (batteryLevel < 50) {
                    batteryIcon.classList.add('medium');
                }
            }
        }

        function updateBattery() {
            batteryLevel = Math.max(0, batteryLevel - 0.1);
            
            // Save to localStorage with timestamp
            localStorage.setItem('globalBatteryLevel', batteryLevel.toString());
            localStorage.setItem('batteryLastUpdate', Date.now().toString());
            
            updateBatteryDisplay();
            
            // Check if battery reached 20% or below
            if (batteryLevel <= 20) {
                // Reset to 100% (no redirect)
                batteryLevel = 100;
                localStorage.setItem('globalBatteryLevel', '100');
                localStorage.setItem('batteryLastUpdate', Date.now().toString());
                updateBatteryDisplay();
            }
            
            // Continue the cycle
            setTimeout(updateBattery, 1000);
        }

        // ========== CART FUNCTIONALITY ==========
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let currentProduct = null;
        let isInStock = true; // Default to true
        
        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const cartItems = document.getElementById('cartItems');
            const startCartNav = document.getElementById('startCartNav');
            
            cartCount.textContent = cart.length;
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; color: #999; margin-top: 50px;">Your cart is empty</p>';
                startCartNav.disabled = true;
                startCartNav.textContent = 'Start Navigation (0 items)';
            } else {
                let html = '';
                cart.forEach((item, index) => {
                    html += `
                        <div class="cart-item">
                            <img src="${item.image_url || 'https://via.placeholder.com/60'}" class="cart-item-img">
                            <div class="cart-item-info">
                                <div class="cart-item-name">${item.name}</div>
                                <div class="cart-item-price">AED ${item.price}</div>
                            </div>
                            <button class="remove-item" onclick="removeFromCart(${index})">🗑️</button>
                        </div>
                    `;
                });
                cartItems.innerHTML = html;
                startCartNav.disabled = false;
                startCartNav.textContent = `Start Navigation (${cart.length} items)`;
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
        }
        
        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
        }
        
        function showToast(message, duration = 2000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }
        
        function addToCart() {
            if (!currentProduct) return;
            
            if (!isInStock) {
                showToast('Item is out of stock', 2000);
                return;
            }
            
            if (cart.length >= 5) {
                showToast('Cart is full (max 5 items)', 2000);
                return;
            }
            
            if (cart.some(item => item.sku === currentProduct.sku)) {
                showToast('Item already in cart', 2000);
                return;
            }
            
            cart.push(currentProduct);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
            showToast('Added to cart!', 2000);
        }
        
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
            showToast('Removed from cart', 2000);
        }
        
        function clearCart() {
            cart = [];
            updateCartUI();
            showToast('Cart emptied', 2000);
        }
        
        function startCartNavigation() {
            if (cart.length === 0) return;
            
            localStorage.setItem('navigationCart', JSON.stringify(cart));
            localStorage.setItem('currentCartIndex', '0');
            window.location.href = '/cart-navigation';
        }

        // ========== FUNCTION TO CHECK INVENTORY STATUS ==========
        function isInventoryInStock(inventoryCount) {
            if (inventoryCount === null || inventoryCount === undefined) {
                return true;
            }

            return Number(inventoryCount) > 0;
        }

        // ========== LOAD PRODUCT DETAILS (UPDATED: removed Omar's sync) ==========
        window.onload = async function() {
            // Initialize and start battery simulation
            initBattery();
            setTimeout(() => {
                if (typeof batteryLevel === 'number' && !isNaN(batteryLevel)) {
                    updateBattery();
                }
            }, 1000);

            // Initialize cart UI
            updateCartUI();
            
            const sku = localStorage.getItem('selectedProductSku');
            if (!sku) {
                document.getElementById('loading').textContent = "No product selected.";
                return;
            }

            try {
                // Fetch product details from backend
                const response = await fetch(`/api/products/${sku}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // API returns the product object directly
                const data = await response.json();
                const product = data.product || data;
                
                // Store current product for cart
                currentProduct = {
                    sku: product.sku,
                    name: product.name,
                    price: product.price,
                    image_url: product.image_url,
                    inventory: product.inventory,
                    aisle: product.aisle || "A1",
                    shelf: product.shelf || "3"
                };

                // Check inventory status from backend
                isInStock = isInventoryInStock(product.inventory);

                // Update UI with product details
                document.getElementById('prodName').textContent = product.name;
                document.getElementById('prodPrice').textContent = `AED ${product.price}`;
                document.getElementById('prodAisle').textContent = product.aisle || "A1";
                document.getElementById('prodShelf').textContent = product.shelf || "3";
                document.getElementById('prodImg').src = product.image_url || `https://via.placeholder.com/400?text=${encodeURIComponent(product.name)}`;
                
                // Update inventory status display
                const statusIndicator = document.getElementById('statusIndicator');
                const statusText = document.getElementById('statusText');
                const navBtn = document.getElementById('navBtn');
                const cartBtn = document.getElementById('cartBtn');
                
                if (isInStock) {
                    statusIndicator.className = 'status-indicator in-stock';
                    statusText.className = 'status-text in-stock-text';
                    statusText.textContent = 'In Stock';
                    navBtn.disabled = false;
                    cartBtn.disabled = false;
                } else {
                    statusIndicator.className = 'status-indicator out-of-stock';
                    statusText.className = 'status-text out-of-stock-text';
                    statusText.textContent = 'Out Of Stock';
                    navBtn.disabled = true;
                    cartBtn.disabled = true;
                }
                
                // Load saved language preference
                const savedLang = localStorage.getItem('preferredLanguage') || 'en';
                let langName = '';
                
                switch(savedLang) {
                    case 'en': langName = 'English'; break;
                    case 'ar': langName = 'العربية'; break;
                    case 'fr': langName = 'Français'; break;
                    case 'hi': langName = 'हिन्दी'; break;
                    case 'ur': langName = 'اردو'; break;
                    case 'zh': langName = '中文'; break;
                }
                
                document.getElementById('selectedLanguage').textContent = langName;
                
                // Apply translations if available
                if (translations[savedLang]) {
                    document.getElementById('aisleLabel').textContent = translations[savedLang].aisle;
                    document.getElementById('shelfLabel').textContent = translations[savedLang].shelf;
                    document.getElementById('navBtn').textContent = translations[savedLang].startNav;
                    document.getElementById('cartBtn').textContent = translations[savedLang].addToCart;
                }
                
                // Update active class in language dropdown
                const options = document.querySelectorAll('.language-option');
                options.forEach((option, index) => {
                    option.classList.remove('active');
                    if ((savedLang === 'en' && index === 0) ||
                        (savedLang === 'ar' && index === 1) ||
                        (savedLang === 'fr' && index === 2) ||
                        (savedLang === 'hi' && index === 3) ||
                        (savedLang === 'ur' && index === 4) ||
                        (savedLang === 'zh' && index === 5)) {
                        option.classList.add('active');
                    }
                });
                
                // Hide loading, show details
                document.getElementById('loading').style.display = 'none';
                document.getElementById('detailCard').style.display = 'flex';
                
            } catch (error) {
                console.error("Error loading product:", error);
                document.getElementById('loading').innerHTML = "Error loading product.<br>Please try again.";
            }

        };

        async function startNavigation() {
            if (!isInStock) {
                showToast('Cannot navigate to out of stock item', 2000);
                return;
            }
            
            const name = document.getElementById('prodName').textContent;
            
            // Just store the product name and redirect
            localStorage.setItem('lastQuery', name);
            
            // Clear any previous navigation error
            localStorage.removeItem('pendingNavigationError');
            
            // Redirect to navigation page - let navigation.html handle the API call
            window.location.href = "/navigation";
        }
    </script>
</body>
