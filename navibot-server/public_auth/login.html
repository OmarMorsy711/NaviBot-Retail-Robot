
<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NaviBot Login</title>

<style>
*{ box-sizing: border-box; }

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(#3f7fc5, #57c6ff);
  font-family: Arial, Helvetica, sans-serif;
  overflow:hidden;
}

.container{
  text-align:center;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding: 24px;

  /* moved slightly up AND left */
  transform: translate(-20px, -18px);
}

.logo{
  font-size:88px; color:white; font-weight:800;
  text-shadow:2px 2px black;
}

.subtitle{
  font-size:42px;
  color:white;
  margin-bottom:32px;
}

.card{
  width:720px;
  max-width: calc(100vw - 48px);
  background:#ddd;
  margin:0 auto;
  border-radius:12px;
  padding:35px;
  position:relative;
  box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

.card h2{ font-size:44px; margin-bottom:25px; }

.form-row{
  display:flex;
  align-items:center;
  gap:20px;
  margin:18px 0;
  justify-content:center;
  flex-wrap:wrap;
}

label{
  width:160px;
  font-size:30px;
  text-align:left;
  color:#444;
}

.input-wrap{
  position:relative;
  width:380px;
  max-width: 100%;
}

input{
  width:100%;
  height:48px;
  font-size:22px;
  padding:8px 44px 8px 12px;
  border:2px solid #ccc;
  background:#fffef2;
}


input.input-error{
  border-color:#e11d48;
  box-shadow: 0 0 0 4px rgba(225,29,72,0.18);
}

@keyframes shake {
  0%   { transform: translateX(0); }
  20%  { transform: translateX(-10px); }
  40%  { transform: translateX(10px); }
  60%  { transform: translateX(-8px); }
  80%  { transform: translateX(8px); }
  100% { transform: translateX(0); }
}
.card.shake{
  animation: shake 260ms ease-in-out;
}

.eye-btn{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:26px;
  height:26px;
  cursor:pointer;
  opacity:0.85;
  user-select:none;
}
.eye-btn:hover{ opacity:1; }

.error{ color:#b00000; font-size:26px; margin:15px 0; display:none; }

.lockout-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.lockout-card{
  width:520px;
  max-width: calc(100vw - 48px);
  background:#fff;
  border-radius:14px;
  padding:30px;
  text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,0.35);
}
.lockout-title{ font-size:32px; font-weight:800; color:#1e62b3; margin-bottom:10px; }
.lockout-text{ font-size:24px; color:#333; }

button{
  width:260px; height:60px; background:#4fc3ff;
  border:none; border-radius:8px; font-size:32px;
  font-weight:bold; cursor:pointer;
}

/* original robot placement */
.robot{
  position:absolute;
  right:-225px;
  top:-5px;
  width:320px;
  pointer-events:none;
}

/* Small screens */
@media (max-width: 860px){
  .logo{ font-size:64px; }
  .subtitle{ font-size:28px; margin-bottom:22px; }
  .card h2{ font-size:36px; }
  label{ width:100%; text-align:center; font-size:24px; }
  .form-row{ gap:12px; }
  button{ width: 100%; max-width: 320px; }
  .robot{ display:none; }

  /* reset nudge on small screens */
  .container{ transform: translate(0, 0); }
}
</style>
</head>

<body>
<div class="container">
  <div class="logo">Navibot</div>
  <div class="subtitle">Welcome to NaviBot’s web dashboard!</div>

  <div class="card" id="loginCard">
    <img src="/auth/robot.png" class="robot" alt="robot">
    <h2>Admin Portal</h2>

    <div class="form-row">
      <label>Username:</label>
      <div class="input-wrap">
        <input id="username" type="text" autocomplete="username">
      </div>
    </div>

    <div class="form-row">
      <label>Password:</label>
      <div class="input-wrap">
        <input id="password" type="password" autocomplete="current-password">
        <img
          id="eyeIcon"
          class="eye-btn"
          src="/auth/close-eye.png"
          alt="Show password"
          onclick="togglePassword()"
        >
      </div>
    </div>

    <div id="errorMsg" class="error">Invalid username or password</div>

    <button onclick="login()">LOGIN</button>
  </div>
</div>

<div id="lockoutOverlay" class="lockout-overlay">
  <div class="lockout-card">
    <div class="lockout-title">Too Many Attempts</div>
    <div id="lockoutCountdown" class="lockout-text">Please try again in 01:00</div>
  </div>
</div>

<script>
const API_BASE = "";

/* track failed login attempts */
let failedAttempts = 0;

function setErrorVisible(visible, msg="Invalid username or password"){
  const err = document.getElementById("errorMsg");
  err.textContent = msg;
  err.style.display = visible ? "block" : "none";
}

/* visual feedback on failed try */
function failFeedback(){
  const card = document.getElementById("loginCard");
  const user = document.getElementById("username");
  const pass = document.getElementById("password");

  card.classList.remove("shake");
  void card.offsetWidth;
  card.classList.add("shake");

  user.classList.add("input-error");
  pass.classList.add("input-error");

  setTimeout(() => {
    user.classList.remove("input-error");
    pass.classList.remove("input-error");
  }, 650);
}

function togglePassword(){
  const input = document.getElementById("password");
  const eye = document.getElementById("eyeIcon");

  const isHidden = input.type === "password";
  input.type = isHidden ? "text" : "password";

  eye.src = isHidden ? "/auth/open-eye.png" : "/auth/close-eye.png";
  eye.alt = isHidden ? "Hide password" : "Show password";
}

async function apiLogin(username, password){
  try {
    const res = await fetch(`${API_BASE}/api/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const payload = await res.json().catch(()=> ({}));
    return { ok: res.ok, status: res.status, payload, networkError: false };
  } catch (err) {
    return {
      ok: false,
      status: 0,
      payload: { detail: "Couldn't connect to server" },
      networkError: true
    };
  }
}

let lockoutTimer = null;

function startLockoutCountdown(lockoutUntil){
  const overlay = document.getElementById("lockoutOverlay");
  const countdown = document.getElementById("lockoutCountdown");
  overlay.style.display = "flex";

  if (lockoutTimer) clearInterval(lockoutTimer);

  const tick = () => {
    const now = Date.now() / 1000;
    const remaining = Math.max(0, Math.ceil(lockoutUntil - now));
    const minutes = String(Math.floor(remaining / 60)).padStart(2, "0");
    const seconds = String(remaining % 60).padStart(2, "0");
    countdown.textContent = `Please try again in ${minutes}:${seconds}`;

    if (remaining <= 0) {
      clearInterval(lockoutTimer);
      lockoutTimer = null;
      overlay.style.display = "none";
      setErrorVisible(false);
      failedAttempts = 0;
    }
  };

  tick();
  lockoutTimer = setInterval(tick, 1000);
}

function goToDashboardForUser(username){
  if (username === "John Doe") {
    window.location.href = "/employee-dashboard";
  } else {
    window.location.href = "/dashboard";
  }
}

async function login(){
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value;

  if (document.getElementById("lockoutOverlay").style.display === "flex") {
    return;
  }

  if(!u || !p){
    setErrorVisible(true, "Username and Password are empty!");
    return;
  }

  /* lock out on the 4th try */
  if (failedAttempts >= 3) {
    const lockoutUntil = Math.floor(Date.now() / 1000) + 60;
    startLockoutCountdown(lockoutUntil);
    return;
  }

  const res = await apiLogin(u, p);

  if (res.networkError) {
    setErrorVisible(true, "Couldn't connect to server");
    failFeedback();
    return;
  }

  if (res.ok) {
    localStorage.setItem("isLoggedIn", "1");
    localStorage.setItem("username", u);
    failedAttempts = 0;
    goToDashboardForUser(u);
    return;
  }

  if (res.status === 429) {
    const detail = res.payload && res.payload.detail ? res.payload.detail : {};
    const lockoutUntil = detail.lockout_until;
    if (lockoutUntil) {
      startLockoutCountdown(lockoutUntil);
      return;
    }
    setErrorVisible(true, "Too many attempts. Please try again later.");
    failFeedback();
    return;
  }

  failedAttempts++;
  const message = (res.payload && res.payload.detail) || "Invalid Username or Password";
  setErrorVisible(true, message);
  failFeedback();
}

document.addEventListener("keydown", (e)=>{
  if(e.key === "Enter") login();
});
</script>

</body>
</html>
